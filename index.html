<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Estudio LV</title>
<style>
:root{--pri:#4f46e5;--pri2:#7c3aed;--bg:#f4f5fb;--card:#fff;--txt:#1e1b4b;--sub:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:90px}
header{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 26px;border-radius:0 0 26px 26px}
header small{opacity:.85;font-size:13px}
header h1{font-size:24px;margin-top:4px}
.wrap{padding:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:-34px}
.stat{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 14px rgba(79,70,229,.12)}
.stat b{font-size:22px;color:var(--pri);display:block}
.stat span{font-size:11px;color:var(--sub)}
h2{font-size:17px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);display:flex;align-items:center;gap:12px}
.dot{width:14px;height:40px;border-radius:8px;flex-shrink:0}
.card .info{flex:1;min-width:0}
.card .info b{font-size:15px;display:block}
.card .info span{font-size:12px;color:var(--sub)}
.card.hecha .info b{text-decoration:line-through;color:var(--sub)}
.icon-btn{background:none;border:none;font-size:18px;color:var(--sub);padding:6px;cursor:pointer}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;cursor:pointer}
.check.on{background:#10b981;border-color:#10b981}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;margin-top:5px}
.b-rojo{background:#fee2e2;color:#b91c1c}.b-nar{background:#ffedd5;color:#c2410c}.b-azul{background:#e0e7ff;color:#4338ca}.b-gris{background:#f3f4f6;color:#6b7280}
.prio{font-size:11px;margin-left:6px}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:30px 10px;background:var(--card);border-radius:16px}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.full{width:100%;padding:14px;font-size:15px;margin-top:8px}
.btn.ghost{background:#eef2ff;color:var(--pri)}
.tip{background:#eef2ff;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.4}
.tabs{display:flex;background:#e9eaf5;border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:none;background:none;padding:9px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);cursor:pointer}
.tabs button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.08)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0 calc(env(safe-area-inset-bottom) + 8px);border-top:1px solid var(--line)}
nav button{background:none;border:none;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;flex:1}
nav button i{font-style:normal;font-size:21px}
nav button.on{color:var(--pri);font-weight:700}
.view{display:none}.view.on{display:block}
.modal{position:fixed;inset:0;background:rgba(15,13,40,.5);display:none;align-items:flex-end;z-index:9}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:90vh;overflow:auto}
.sheet h3{margin-bottom:14px}
label{font-size:13px;color:var(--sub);display:block;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--txt);-webkit-appearance:none}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors div{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.colors div.sel{border-color:var(--txt)}
.prios{display:flex;gap:8px}
.prios div{flex:1;text-align:center;padding:10px;border-radius:12px;border:2px solid var(--line);font-size:14px;font-weight:600;cursor:pointer}
.prios div.sel{border-color:var(--pri);background:#eef2ff;color:var(--pri)}
.soon{text-align:center;padding:60px 20px;color:var(--sub)}
.soon i{font-style:normal;font-size:46px;display:block;margin-bottom:10px}
</style>
</head>
<body>

<header>
  <small id="saludo">Hola 👋</small>
  <h1>Estudio LV</h1>
</header>

<div class="wrap">
  <!-- INICIO -->
  <section class="view on" id="v-inicio">
    <div class="stats">
      <div class="stat"><b id="s-mat">0</b><span>Materias</span></div>
      <div class="stat"><b id="s-ent">0</b><span>Pendientes</span></div>
      <div class="stat"><b id="s-pro">–</b><span>Promedio</span></div>
    </div>
    <h2>Próximas entregas</h2>
    <div id="prox-inicio"></div>
    <h2>Tus materias</h2>
    <div id="lista-inicio"></div>
    <h2>Consejo del día</h2>
    <div class="tip" id="tip"></div>
  </section>

  <!-- MATERIAS -->
  <section class="view" id="v-materias">
    <h2>Materias <button class="btn" onclick="abrirMateria()">+ Nueva</button></h2>
    <div id="lista-materias"></div>
  </section>

  <!-- ENTREGAS -->
  <section class="view" id="v-entregas">
    <h2>Entregas <button class="btn" onclick="abrirEntrega()">+ Nueva</button></h2>
    <div class="tabs">
      <button class="on" data-f="pend">Pendientes</button>
      <button data-f="hechas">Hechas</button>
    </div>
    <div id="lista-entregas"></div>
  </section>

  <section class="view" id="v-horario"><div class="soon"><i>🗓️</i>Horario — Paso 3</div></section>
  <section class="view" id="v-enfoque"><div class="soon"><i>⏱️</i>Enfoque — Paso 5</div></section>
</div>

<nav>
  <button class="on" data-v="inicio"><i>🏠</i>Inicio</button>
  <button data-v="materias"><i>📚</i>Materias</button>
  <button data-v="entregas"><i>📌</i>Entregas</button>
  <button data-v="horario"><i>🗓️</i>Horario</button>
  <button data-v="enfoque"><i>⏱️</i>Enfoque</button>
</nav>

<!-- MODAL MATERIA -->
<div class="modal" id="m-materia" onclick="if(event.target===this)cerrar('m-materia')">
  <div class="sheet">
    <h3 id="m-titulo">Nueva materia</h3>
    <label>Nombre</label>
    <input id="f-nombre" placeholder="Ej: Psicometría">
    <label>Docente (opcional)</label>
    <input id="f-docente" placeholder="Ej: Prof. García">
    <label>Color</label>
    <div class="colors" id="f-colores"></div>
    <button class="btn full" onclick="guardarMateria()">Guardar</button>
    <button class="btn full ghost" id="b-borrar" onclick="borrarMateria()">Eliminar materia</button>
  </div>
</div>

<!-- MODAL ENTREGA -->
<div class="modal" id="m-entrega" onclick="if(event.target===this)cerrar('m-entrega')">
  <div class="sheet">
    <h3 id="e-titulo">Nueva entrega</h3>
    <label>¿Qué hay que entregar?</label>
    <input id="e-nombre" placeholder="Ej: Fase 2 - Trabajo colaborativo">
    <label>Materia</label>
    <select id="e-materia"></select>
    <label>Fecha de entrega</label>
    <input type="date" id="e-fecha">
    <label>Prioridad</label>
    <div class="prios" id="e-prios"></div>
    <button class="btn full" onclick="guardarEntrega()">Guardar</button>
    <button class="btn full ghost" id="e-borrar" onclick="borrarEntrega()">Eliminar entrega</button>
  </div>
</div>

<script>
const KEY='estudioLV';
let db=JSON.parse(localStorage.getItem(KEY)||'{"materias":[],"entregas":[]}');
if(!db.entregas)db.entregas=[];
const COLORES=['#4f46e5','#7c3aed','#db2777','#ef4444','#f59e0b','#10b981','#06b6d4','#0ea5e9'];
const PRIOS={alta:'🔴 Alta',media:'🟠 Media',baja:'🟢 Baja'};
let editId=null,colorSel=COLORES[0],editEnt=null,prioSel='media',filtro='pend';
const TIPS=['Divide las tareas grandes en pasos de 25 minutos.','Revisa tus entregas de la semana cada lunes.','Estudia lo más difícil cuando tengas más energía.','Explicar un tema en voz alta te ayuda a recordarlo.','Descansa 5 minutos por cada 25 de estudio.','Empieza las entregas importantes al menos 3 días antes.'];

function guardar(){localStorage.setItem(KEY,JSON.stringify(db))}
function $(id){return document.getElementById(id)}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function saludo(){const h=new Date().getHours();$('saludo').textContent=(h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches')+' 👋'}

/* ---------- MATERIAS ---------- */
function tarjeta(m,editable){
  return `<div class="card"><div class="dot" style="background:${m.color}"></div>
  <div class="info"><b>${esc(m.nombre)}</b><span>${esc(m.docente||'Sin docente')}</span></div>
  ${editable?`<button class="icon-btn" onclick="abrirMateria('${m.id}')">✏️</button>`:''}</div>`;
}
function pintarColores(){
  $('f-colores').innerHTML=COLORES.map(c=>`<div style="background:${c}" class="${c===colorSel?'sel':''}" onclick="colorSel='${c}';pintarColores()"></div>`).join('');
}
function abrirMateria(id){
  editId=id||null;
  const m=db.materias.find(x=>x.id===id);
  $('m-titulo').textContent=m?'Editar materia':'Nueva materia';
  $('f-nombre').value=m?m.nombre:'';
  $('f-docente').value=m?m.docente:'';
  colorSel=m?m.color:COLORES[db.materias.length%COLORES.length];
  $('b-borrar').style.display=m?'block':'none';
  pintarColores();
  $('m-materia').classList.add('on');
}
function guardarMateria(){
  const nombre=$('f-nombre').value.trim();
  if(!nombre){alert('Escribe el nombre de la materia');return}
  const datos={nombre,docente:$('f-docente').value.trim(),color:colorSel};
  if(editId){Object.assign(db.materias.find(x=>x.id===editId),datos)}
  else{db.materias.push({id:Date.now().toString(),...datos})}
  guardar();render();cerrar('m-materia');
}
function borrarMateria(){
  if(!confirm('¿Eliminar esta materia?'))return;
  db.materias=db.materias.filter(x=>x.id!==editId);
  guardar();render();cerrar('m-materia');
}

/* ---------- ENTREGAS ---------- */
function dias(fecha){
  const h=new Date();h.setHours(0,0,0,0);
  const f=new Date(fecha+'T00:00:00');
  return Math.round((f-h)/86400000);
}
function etiqueta(e){
  if(e.hecha)return '<span class="badge b-gris">✔ Entregada</span>';
  const d=dias(e.fecha);
  if(d<0)return `<span class="badge b-rojo">Vencida hace ${-d} d</span>`;
  if(d===0)return '<span class="badge b-rojo">¡Hoy!</span>';
  if(d===1)return '<span class="badge b-nar">Mañana</span>';
  if(d<=3)return `<span class="badge b-nar">En ${d} días</span>`;
  return `<span class="badge b-azul">En ${d} días</span>`;
}
function fechaBonita(f){
  return new Date(f+'T00:00:00').toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'});
}
function tarjetaEntrega(e){
  const m=db.materias.find(x=>x.id===e.materiaId);
  return `<div class="card ${e.hecha?'hecha':''}">
    <div class="check ${e.hecha?'on':''}" onclick="toggleEntrega('${e.id}')">${e.hecha?'✓':''}</div>
    <div class="dot" style="background:${m?m.color:'#d1d5db'};width:6px"></div>
    <div class="info"><b>${esc(e.titulo)}</b>
      <span>${m?esc(m.nombre):'Sin materia'} · ${fechaBonita(e.fecha)}<span class="prio">${PRIOS[e.prioridad]}</span></span><br>
      ${etiqueta(e)}</div>
    <button class="icon-btn" onclick="abrirEntrega('${e.id}')">✏️</button></div>`;
}
function ordenadas(){
  const p={alta:0,media:1,baja:2};
  return [...db.entregas].sort((a,b)=>a.fecha.localeCompare(b.fecha)||p[a.prioridad]-p[b.prioridad]);
}
function pintarPrios(){
  $('e-prios').innerHTML=Object.keys(PRIOS).map(k=>`<div class="${k===prioSel?'sel':''}" onclick="prioSel='${k}';pintarPrios()">${PRIOS[k]}</div>`).join('');
}
function abrirEntrega(id){
  if(!db.materias.length){alert('Primero agrega al menos una materia');ir('materias');return}
  editEnt=id||null;
  const e=db.entregas.find(x=>x.id===id);
  $('e-titulo').textContent=e?'Editar entrega':'Nueva entrega';
  $('e-nombre').value=e?e.titulo:'';
  $('e-materia').innerHTML=db.materias.map(m=>`<option value="${m.id}">${esc(m.nombre)}</option>`).join('');
  if(e&&db.materias.some(m=>m.id===e.materiaId))$('e-materia').value=e.materiaId;
  $('e-fecha').value=e?e.fecha:hoyISO();
  prioSel=e?e.prioridad:'media';
  $('e-borrar').style.display=e?'block':'none';
  pintarPrios();
  $('m-entrega').classList.add('on');
}
function guardarEntrega(){
  const titulo=$('e-nombre').value.trim();
  const fecha=$('e-fecha').value;
  if(!titulo){alert('Escribe qué hay que entregar');return}
  if(!fecha){alert('Elige la fecha de entrega');return}
  const datos={titulo,materiaId:$('e-materia').value,fecha,prioridad:prioSel};
  if(editEnt){Object.assign(db.entregas.find(x=>x.id===editEnt),datos)}
  else{db.entregas.push({id:Date.now().toString(),hecha:false,...datos})}
  guardar();render();cerrar('m-entrega');
}
function borrarEntrega(){
  if(!confirm('¿Eliminar esta entrega?'))return;
  db.entregas=db.entregas.filter(x=>x.id!==editEnt);
  guardar();render();cerrar('m-entrega');
}
function toggleEntrega(id){
  const e=db.entregas.find(x=>x.id===id);
  e.hecha=!e.hecha;guardar();render();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  filtro=b.dataset.f;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});

/* ---------- GENERAL ---------- */
function cerrar(id){$(id).classList.remove('on')}
function ir(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>ir(b.dataset.v));

function render(){
  const pend=ordenadas().filter(e=>!e.hecha);
  $('s-mat').textContent=db.materias.length;
  $('s-ent').textContent=pend.length;
  const vacio='<div class="empty">Aún no tienes materias.<br><br><button class="btn" onclick="ir(\'materias\');abrirMateria()">+ Agregar materia</button></div>';
  $('lista-inicio').innerHTML=db.materias.length?db.materias.map(m=>tarjeta(m,false)).join(''):vacio;
  $('lista-materias').innerHTML=db.materias.length?db.materias.map(m=>tarjeta(m,true)).join(''):'<div class="empty">Toca “+ Nueva” para agregar tu primera materia.</div>';
  $('prox-inicio').innerHTML=pend.length?pend.slice(0,3).map(tarjetaEntrega).join(''):'<div class="empty">🎉 No tienes entregas pendientes.</div>';
  const lista=filtro==='pend'?pend:ordenadas().filter(e=>e.hecha).reverse();
  $('lista-entregas').innerHTML=lista.length?lista.map(tarjetaEntrega).join(''):`<div class="empty">${filtro==='pend'?'No hay entregas pendientes.<br>Toca “+ Nueva” para agregar una.':'Aún no has marcado entregas como hechas.'}</div>`;
}

saludo();
$('tip').textContent='💡 '+TIPS[new Date().getDate()%TIPS.length];
render();
</script>
</body>
</html>
